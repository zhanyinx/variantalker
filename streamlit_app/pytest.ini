# MAFigate Test Configuration
# pytest configuration file
#
# NOTE ON THE SECTION HEADER: this must be `[pytest]`. It was `[tool:pytest]` —
# the setup.cfg spelling — which pytest silently ignores inside a pytest.ini, so
# every setting below was dead: no coverage ran, no markers were registered, and
# neither --strict-markers nor --strict-config was in effect. Measured before the
# fix: `pytest --markers` listed none of the four markers declared here.
#
# NOTE ON COVERAGE: the coverage flags that used to live in `addopts` are not here.
# They were `--cov=. --cov-fail-under=80`, and reviving them verbatim would have
# broken every test run for two independent reasons:
#   1. pytest-cov is not a declared dependency (requirements.txt says only
#      "pip install pytest"), so `--cov` is an unrecognised argument on a stock
#      install and pytest exits 4 before collecting anything.
#   2. The floor is unreachable. Real source coverage was 17% (2,524 statements,
#      2,098 missed) when that was written — the old 29% figure counted the test
#      files themselves — and is 39% (2,812 statements, 1,711 missed) now that
#      issue #28's work has landed. 80% would still fail on unmodified code.
# Coverage therefore runs where it is asked for explicitly — `make test-cov` and
# CI — and its `omit` for the vendored code lives in .coveragerc, which is the
# only place pytest-cov reads coverage settings from (never pytest.ini).
#
# The 39% is measured with `bin/` ABSENT, which is the only stable way to measure
# it: the parity module calls the app's entry point in process, so the number moves
# with what is checked out beside the app. `make test-cov` builds that tree; the
# Makefile explains why.

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short

# Test markers
#
# NOTE ON THE MARKER THAT IS GONE: `performance` is not declared here any more, and
# nothing has carried it since issue #33 deleted test_integration.py — which held both
# tests the spec counted as performance: `test_filtering_performance`, a 1000-row filter
# asserted to finish inside 5 seconds, and `test_large_dataset_workflow`, which built 100
# rows and then asserted nothing about cost at all. The 5-second bound is roughly 1000x
# slack, so it was green on any machine and on any implementation, including a quadratic
# one.
#
# What replaced them is deterministic and structural, asserting the costs that actually
# exist rather than a wall-clock ceiling: `frame_for_masks` returning the caller's own
# object on the happy path, measured with `tracemalloc` against a 400,000-row frame
# (`tests/test_absent_columns.py`), and the gene adapter's temp file existing inside the
# context manager and gone after it (`tests/test_filter_entry_point.py`).
#
# Issue #41 removes the declaration, which was the last trace of them: a marker left
# declared invites the next timing test back under a name that reads as sanctioned.
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    ui: marks tests as UI component tests

# Ignore patterns
norecursedirs =
    .git
    .tox
    dist
    build
    vendor
    *.egg
    __pycache__
    .pytest_cache
    htmlcov

# Filter warnings
#
# NOTE ON THE LAST ENTRY: warning filters match *subclasses*, so `ignore::UserWarning`
# silences every UserWarning subclass too — including MissingColumnsWarning, which the
# app raises when a MAF lacks columns the pipeline's output would carry. Left silenced,
# a call site that forgets to handle it could never be caught here: the tests that
# assert the warning pass only because each one re-filters explicitly. The `error::`
# entry comes last, which is where it takes precedence, and turns any *unhandled*
# occurrence into a test failure. Tests that mean to provoke it still override this
# with `pytest.warns` or their own `catch_warnings`.
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::config.columns.MissingColumnsWarning
